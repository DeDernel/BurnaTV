<!DOCTYPE html>
<html lang="en"">
<head>
    <meta charset=" UTF-8">
<link
    href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100..700&family=Ubuntu:wght@300..700&display=swap"
    rel="stylesheet">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Orbitron:wght@700;900&display=swap"
    rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<title>Burna/Movie</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="images/Burna.jpg">
</head>

<body class="bg-gray-950" data-page="browse">

    <nav class="bg-gray-900 w-full max-w-[1100px] mx-auto pb-5">
        <div class="flex flex-col gap-5 p-5 bg-gray-900">
            <div class="flex items-center justify-between px-2">
                <i class="fa-solid fa-film text-violet-600 text-xl"></i>
                <h3 class="text-gray-300">Burna / Discover Movies</h3>
            </div>

            <div class="relative">
                <div class="flex items-center gap-2 rounded-xl border border-gray-600 px-2">
                    <button>
                        <i class="fa-solid fa-magnifying-glass text-xl text-gray-500 cursor-pointer"></i>
                    </button>

                    <input type="text" id="searchInput" autocomplete="off" placeholder="Movies,Series..."
                        class="p-2 rounded-xl w-full bg-inherit text-white outline-none">
                    
                </div>
                <ul class="absolute
                    hidden 
                    rounded-xl 
                    shadow-xl 
                    bg-gray-800 
                    border border-gray-700 
                    top-full shadow-xl 
                    searchSuggestions 
                    z-10 w-full 
                    flex flex-col gap-1">
                </ul>
            </div>
        </div>
        <div class="p-5">
            <h3 class="text-gray-400 mb-2">Quick Descovery</h3>

            <ul class="recomendedFilters flex flex-wrap gap-2">
            </ul>
        </div>
        





        

        <div class="mt-3 mb-2 py-3 advancedFilters">
            <div class="FilterDropDowns border rounded-xl border-gray-700 mx-4 p-4 flex flex-col gap-2">
                <div class="flex justify-between">
                    <h3 class="text-gray-400">Advanced Filters</h3>
                    <span class="bg-purple-500/30 py-1 px-4 rounded-xl text-white filterCount">filters</span>
                </div>

            </div>
            <div class="activeFilters">

            </div>

            <div class="flex gap-2 mt-5 mx-10 text-lg">

                <button class="StartSeach text-white flex-1 bg-violet-600 p-4 rounded-xl">
                    Apply Filters
                </button>

                <button class="resetSearch text-white flex-2 bg-gray-500/40 p-4 rounded-xl">
                    <i class="fa-solid fa-arrow-rotate-left"></i>
                </button>

            </div>

        </div>
    </nav>
    <article
        class="allMS w-full max-w-[1200px] justify-center mx-auto grid grid-cols-[repeat(auto-fit,205px)] gap-2 mt-5 mb-12">


    </article>
    <script type="module" src="src/main.js"></script>
</body>

</html>
