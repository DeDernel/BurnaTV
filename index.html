<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burna</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100..700&family=Ubuntu:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="images/Burna.jpg">

</head>
<body class="bg-gray-950 overflow-x-hidden relative" data-page="main">

<div class="wrapper max-w-[1700px] mx-auto">
    <header class="relative">

        <nav class="py-3 gap-3 text-gray-100 flex items-center justify-between bg-gray-900 relative">

            <!-- left Drawer -->
            <section class="w-fit flex items-center">
                <!-- Toggle Menu -->
                <i class="fa-solid fa-bars text-2xl px-5 cursor-pointer openMenu lg:hidden"></i>
                <!-- Drawer Content -->
                <div class="SideBar pl-2 gap-1 flex flex-col fixed bg-gray-900 border-r-2 border-purple-600 top-0 ClosedSidebar w-64 h-[100vh] z-50">
                    <!-- Close Menu -->
                    <span class="flex items-center justify-end">
                        <i class="fa-solid fa-xmark text-2xl p-4 mx-4 my-1 cursor-pointer closeMenu"></i>
                    </span>







 
                  
                </div>

                <h1 class="text-xl text-violet-500 font-bold px-2 py-1 rounded">Burna</h1>

                <!-- Search box -->
                
                <div class="flex gap-5 ml-10 hidden lg:flex">

                    <div class="relative">
                        <span class="cursor-pointer group">Genres <i class="fa-solid fa-angle-down text-sm"></i></span>
                        <div class="z-20 genres hidden p-2 absolute top-full flex flex-col bg-black w-fit">
                            <a href="">Action</a>
                            <a href="">Drama</a>
                            <a href="">Sci-Fi</a>
                            <a href="">Horor</a>
                            <a href="">History</a>
                        </div>
                    </div>
                    
                    <a href="">Movies</a>
                    <a href="">Series</a>
                    <a href="">News</a>

                </div>
            </section>

            
            <div class="flex items-center gap-5 mr-5 text-xl">
                <a href="browse.html">
                    <i class="fa-solid fa-magnifying-glass cursor-pointer"></i>
                </a>
                <div class="relative p-[3px]">
                    <i class="fa-regular fa-bell"></i>
                    <!-- <span class="absolute top-0 rounded-xl text-xs bg-red-600 p-[1px]">1</span> -->
                </div>
                <button class="rounded-xl">
                    <i class="fa-regular fa-circle-user"></i>
                </button>
            </div>

        </nav>

        <!-- T Slider -->
        <section class="slider-container touch-pan-y relative group flex h-[80dvh] md:h-[90dvh]">
                <img fetchpriority="high"
                     decoding="async" 
                     class="w-full slider-img object-cover" alt="">

                <h1 class="text-gray-100 my-3 ml-4 absolute top-2"><i class="fa-solid fa-arrow-trend-up"></i> Trends | 2026</h1>

            <button aria-label="Next Slide"
                class="cursor-pointer hidden forward bg-black/30 hover:bg-purple-600
                transition-all duration-300 w-11 h-11 rounded-full
                group-hover:flex items-center justify-center
                absolute right-5 top-1/2 -translate-y-1/2 z-20 text-white">
                    <i class="fa-solid fa-arrow-right text-xl"></i>
            </button>
            <button aria-label="Prev Slide"
                class="cursor-pointer hidden back bg-black/30 hover:bg-purple-600
                transition-all duration-300 w-11 h-11 rounded-full
                group-hover:flex items-center justify-center
                absolute left-5 top-1/2 -translate-y-1/2 z-20 text-white">
                    <i class="fa-solid fa-arrow-left text-xl"></i>
            </button>
                

                <div class="z-10 absolute md:left-10 lg:left-20 lg:top-1/3 bottom-0 w-2/3 slider-info-panel">
                </div>
                
                <div class="absolute inset-0 bg-gradient-to-t from-gray-950 via-gray-950/30 to-transparent pointer-events-none"></div>
                
        </section>
        <div class="pagination-dots flex justify-center mb-10 mt-5">
            
        </div>
    
    </div>

    </header>
</div>




    <main class="flex flex-col gap-5 max-w-[1300px] mx-auto">
        <div class="trending-now px-4">

        </div>
        
        <div class="upcoming px-4">

        </div>


        <section class="collection">
            
        </section>
    </main>

    
    <div class="SidebarOverlay hidden absolute top-0 h-full w-full bg-black/40 z-40"></div>
    <script type="module" src="src/main.js"></script>
</body>
</html>
