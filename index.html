<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burna</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100..700&family=Ubuntu:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="images/Burna.jpg">

</head>
<body class="bg-gray-950 overflow-x-hidden" data-page="main">

<div class="wrapper max-w-[1700px] mx-auto">
    <header class="relative">

        <nav class="py-3 gap-3 text-gray-100 flex items-center justify-between bg-gray-900 relative">

            <!-- left Drawer -->
            <section class="w-fit flex items-center px-5">
                <!-- Toggle Menu -->
                <i class="fa-solid fa-bars text-2xl cursor-pointer openMenu"></i>


                <!-- Drawer Content -->
                <div class="SideBar pl-2 gap-1 flex flex-col fixed bg-gray-900 border-r-2 border-purple-600 top-0 ClosedSidebar w-64 h-[100vh] z-40">
                    <!-- Close Menu -->
                    <span class="flex items-center justify-end">
                        <i class="fa-solid fa-xmark text-2xl p-4 mx-4 my-1 cursor-pointer closeMenu"></i>
                    </span>


                    <div class="flex justify-between activeMoviesNav cursor-pointer">
                        <button class="flex"><svg class="w-5 h-5 text-gray-500 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z"></path></svg> - Movies </button>
                        <i class="fa-solid fa-angle-down mr-5 arrow"></i>
                    </div>
                    <div class="flex flex-col moviesNav">
                        <a href="browse.html?type=movies&filter=250" class="ml-5">250 Top Movies</a>
                        <a href="browse.html?type=movie&filter=new" class="ml-5">New Movies</a>
                        <a href="browse.html?type=movies&filter=trends" class="ml-5">Trending movies</a>
                        <a href="browse.html?type=movies&filter=calendar" class="ml-5">Release calender</a>
                    </div>



                    <div class="flex justify-between activeSeriesNav cursor-pointer">
                        <button class="flex"><svg class="w-5 h-5 text-gray-500 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg> - TV Series</button>   
                        <i class="fa-solid fa-angle-down mr-5 arrow"></i>
                    </div>
                    <div class="flex flex-col seriesNav">
                        <a href="browse.html?type=series&filter=trends" class="ml-5">Trending Series</a>
                        <a href="browse.html?type=series&filter=new" class="ml-5">New Series</a>
                    </div>
 
                    <a href="browse.html?filter=trends" class="trendsBtn block cursor-pointer mr-1"><i class="fa-solid fa-arrow-trend-up text-gray-500"></i> - Trending Now</a>
                </div>

                <h1 class="text-xl bg-purple-500 px-2 py-1 rounded ml-7">Burna</h1>

                <!-- Search box -->
                <a href="browse.html" class="p-[3px] ml-3">
                    <i class="fa-solid fa-magnifying-glass text-xl cursor-pointer"></i>
                </a>
            </section>

            
            <div class="flex items-center gap-5 mr-5">
                <div class="relative p-[3px]">
                    <i class="fa-regular fa-bell text-xl"></i>
                    <span class="absolute top-0 rounded-xl text-xs bg-red-600 p-[1px]">1</span>
                </div>
                <button class="border border-gray-300 px-2 py-1 rounded-xl hover:bg-gray-800 transition">
                    <span>Sign up</span>
                </button>
            </div>

        </nav>

        <!-- T Slider -->
        <section class="slider-container touch-pan-y relative group flex h-[80dvh] md:h-[90dvh]">
                <img fetchpriority="high"
                     decoding="async" 
                     class="w-full slider-img object-cover" alt="">

                <h1 class="text-gray-100 my-3 ml-4 absolute top-2"><i class="fa-solid fa-arrow-trend-up"></i> Trends | 2026</h1>

            <button aria-label="Next Slide"
                class="cursor-pointer hidden forward bg-black/30 hover:bg-purple-600
                transition-all duration-300 w-11 h-11 rounded-full
                group-hover:flex items-center justify-center
                absolute right-5 top-1/2 -translate-y-1/2 z-20 text-white">
                    <i class="fa-solid fa-arrow-right text-xl"></i>
            </button>
            <button aria-label="Prev Slide"
                class="cursor-pointer hidden back bg-black/30 hover:bg-purple-600
                transition-all duration-300 w-11 h-11 rounded-full
                group-hover:flex items-center justify-center
                absolute left-5 top-1/2 -translate-y-1/2 z-20 text-white">
                    <i class="fa-solid fa-arrow-left text-xl"></i>
            </button>
                

                <div class="z-10 absolute md:left-20 md:top-1/2 bottom-0 w-2/3 slider-info-panel">
                </div>
                
                <div class="absolute inset-0 bg-gradient-to-t from-gray-950 via-gray-950/30 to-transparent pointer-events-none"></div>
                
        </section>
        <div class="pagination-dots flex justify-center mb-10">
            
        </div>
    
    </div>

    </header>
</div>




    <div class="sections flex flex-col gap-5 max-w-[1300px] mx-auto">
    </div>

    <script type="module" src="src/main.js"></script>
</body>
</html>
