name: Download TMDB images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download posters and backdrops
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          DATA_FILE: src/services/data.json
          IMAGE_ROOT: images
        run: node scripts/download-tmdb-assets.mjs
      - name: Commit downloaded assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/data.json images/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add TMDB posters and backdrops"
            git push
          fi
